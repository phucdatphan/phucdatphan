<svg xmlns="http://www.w3.org/2000/svg" width="920" height="232" viewBox="0 0 920 232" fill="none" role="img" aria-label="Phan Phuc Dat - IT Business Analyst, Digital Transformation and FinTech Systems">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="920" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#132038"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="918" height="230" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="918" height="230" rx="14" fill="url(#grid)"/>

  <!-- Top Accent Bar -->
  <rect x="36" y="1" width="460" height="2.5" fill="url(#accentLine)"/>

  <!-- Overline Pill -->
  <rect x="36" y="28" width="396" height="26" rx="13" fill="#0F292A" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="51" cy="41" r="4" fill="#10B981"/>
  <text x="63" y="45" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.6">IT BUSINESS ANALYST · DIGITAL TRANSFORMATION · FINTECH</text>

  <!-- Name & Handle -->
  <text x="36" y="96" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" letter-spacing="-0.5">PHAN PHUC DAT</text>
  <text x="318" y="94" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14.5" font-weight="500">@phucdatphan</text>

  <!-- Wrapped Subtitle (Strictly constrained under x=555 so zero overlap) -->
  <text x="36" y="126" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">Bridging BABOK-aligned system specifications with working</text>
  <text x="36" y="146" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">FinTech prototypes, UX flows, and relational data diagnostics.</text>

  <!-- Bottom Domain Tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E2E8F0">
    <rect x="36" y="174" width="118" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="95" y="192" text-anchor="middle">BRD / SRS / UAT</text>

    <rect x="162" y="174" width="136" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="230" y="192" text-anchor="middle">Payment Systems</text>

    <rect x="306" y="174" width="124" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="368" y="192" text-anchor="middle">SQL &amp; Python</text>

    <rect x="438" y="174" width="118" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="497" y="192" text-anchor="middle">Agile / Figma</text>
  </g>

  <!-- Right Architectural Pillars Panel (No KPI numbers, no companies, no GPA) -->
  <g transform="translate(588, 28)">
    <rect x="0" y="0" width="298" height="176" rx="12" fill="#0B1324" stroke="#1E293B" stroke-width="1.2"/>
    <text x="18" y="26" fill="#64748B" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8">CORE PRACTICE LAYERS</text>
    <line x1="18" y1="36" x2="280" y2="36" stroke="#1E293B"/>

    <!-- Layer 1 -->
    <rect x="18" y="48" width="262" height="34" rx="7" fill="#111C2D" stroke="#0EA5E9" stroke-opacity="0.35"/>
    <text x="30" y="69" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">L1</text>
    <text x="56" y="69" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">BABOK Specs &amp; State Modeling</text>

    <!-- Layer 2 -->
    <rect x="18" y="90" width="262" height="34" rx="7" fill="#111C2D" stroke="#8B5CF6" stroke-opacity="0.35"/>
    <text x="30" y="111" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">L2</text>
    <text x="56" y="111" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Checkout UX, Agile AC &amp; UAT</text>

    <!-- Layer 3 -->
    <rect x="18" y="132" width="262" height="34" rx="7" fill="#111C2D" stroke="#10B981" stroke-opacity="0.35"/>
    <text x="30" y="153" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">L3</text>
    <text x="56" y="153" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Reconciliation &amp; Risk Analytics</text>
  </g>
</svg>
